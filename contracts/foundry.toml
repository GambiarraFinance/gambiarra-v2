[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
# Target the Paris EVM so the bytecode does not contain PUSH0, which some
# BNB Smart Chain validators/configs have historically rejected. Safe on BSC.
evm_version = "paris"
optimizer = true
optimizer_runs = 999_999
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
